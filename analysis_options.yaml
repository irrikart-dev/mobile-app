# Static analysis configuration for IrriKart.
# Run with `flutter analyze`. CI runs `flutter analyze --fatal-infos`.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "lib/l10n/generated/**"

  errors:
    # freezed emits @JsonKey on constructor params, which the analyzer flags.
    invalid_annotation_target: ignore
    # Unused imports and dead code should block CI, not just inform.
    unused_import: warning
    dead_code: warning

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously

    # Style — keeps diffs small and reviewable
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - directives_ordering

    # Hygiene
    - avoid_print
    - avoid_returning_null_for_future
    - avoid_unused_constructor_parameters
    - depend_on_referenced_packages
    - unnecessary_lambdas
    - unnecessary_parenthesis
