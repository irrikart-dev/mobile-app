name: irrikart
description: "IrriKart — agricultural tools and inputs marketplace for India."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- state management ---
  flutter_riverpod: ^2.6.1

  # --- auth ---
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.2

  # --- networking ---
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # --- storage ---
  shared_preferences: ^2.3.3

  # --- platform / device ---
  package_info_plus: ^8.1.2

  # --- ui (carried over from the template) ---
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # --- payments ---
  razorpay_flutter: ^1.4.6

  # --- utils ---
  intl: ^0.20.2
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter


  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_lints: ^5.0.0

  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/Illustration/
    - assets/flags/
    - assets/logo/
    - assets/mock/
    - assets/mock/products/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# App icon. Source PNGs are pre-composed (assets/icon/, built from the
# client's droplet mark) rather than left to the tool's own auto-cropping:
# icon_foreground.png is transparent with the mark inset to Android's
# adaptive-icon safe zone; icon_master.png is the same mark flattened onto
# opaque white, since iOS icons must not carry an alpha channel.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_master.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Splash screen. Uses the full lockup (mark + wordmark), per the client's
# corporate branding, unlike the launcher icon which uses the mark alone.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/irrikart_logo_full.png
  color_dark: "#0E1210"
  image_dark: assets/logo/irrikart_logo_full_dark.png
  # Android 12+ masks the splash icon to a circle (2/3 of the canvas), so
  # the lockup is pre-scaled into that safe zone or the name gets clipped.
  android_12:
    image: assets/logo/irrikart_splash_android12.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/logo/irrikart_splash_android12_dark.png
    icon_background_color_dark: "#0E1210"
  android: true
  ios: true
  web: false
