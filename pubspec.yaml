name: irrikart
description: "IrriKart — agricultural tools and inputs marketplace for India."

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- state management (code generation) ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- models ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- networking ---
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # --- routing ---
  go_router: ^14.6.2

  # --- storage ---
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # --- platform / device ---
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.0

  # --- monitoring ---
  sentry_flutter: ^8.12.0

  # --- ui (carried over from the template) ---
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  animations: ^2.0.11
  url_launcher: ^6.3.1
  form_field_validator: ^1.1.0 # retired once core/utils/validators.dart lands

  # --- utils ---
  intl: ^0.20.2
  logger: ^2.5.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_lints: ^5.0.0

  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/Illustration/
    - assets/flags/
    - assets/logo/
    - assets/mock/
    - assets/mock/products/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
    - family: Open Sans
      fonts:
        - asset: assets/fonts/open_sans/OpenSans-Regular.ttf
        - asset: assets/fonts/open_sans/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/open_sans/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/open_sans/OpenSans-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat/Caveat-SemiBold.ttf
          weight: 600
